# JWT is verified inside app-auth with Auth.getUser on every POST action.
# This also supports asymmetric user JWTs without the legacy gateway JWT check.
[functions.app-auth]
verify_jwt = false

# Dedicated high-entropy scheduler credential is checked by the handler.
[functions.inactivity-mail]
verify_jwt = false

[functions.password-policy]
verify_jwt = false

# Only these declared Auth settings are pushed; SMTP and existing redirects stay unchanged.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 300
max_frequency = "1m"

[auth.email.template.magic_link]
subject = "[PartnerDesk] 로그인 인증번호"
content_path = "./supabase/templates/email-mfa-pin.html"
